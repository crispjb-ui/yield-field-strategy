  basis_distribution: {0.1: 0.701, 0.9997: 0.293, 0: 0.006}

unreleased_abis:            # shipped in the frontend bundle; values unknown until deployed
  cornhub: abi/abi_2.json
  yield_pool: abi/abi_3.json       # in-house AMM with virtualEthReserve, buy/sell fee bps, maxSellFeeBps
  truffle_vester: abi/abi_4.json
  buyback: abi/abi_6.json          # DAILY_RATE_BPS of Co-op pool → buys $YIELD → trufflePool
  yield_token: abi/abi_5.json

