# Game-mechanics parameters. Source: https://yieldfields.fun/docs (all pages "Updated 30 Oct 2026").
# null = redacted in the docs (███) or not yet published. The docs state every number is subject to change.
source_url: https://yieldfields.fun/docs
as_of: "2026-11-11"   # official docs 3/8 Nov + un-redacted mirror (yf-unredacted.vercel.app, testnet defaults, "May change") + bundle checks
stage: 1                    # Stage One LIVE (staking + Fert Deck + Fertilizer + export). Farming/$YIELD/deed rewards later. No dates published.
staked_deeds_2026_11_04: 2844   # balanceOf(staking) via RPC; 85.3% of supply

token:                      # /docs/farming-and-yield/yield
  address: null             # published at launch
  max_supply: null          # redacted; fixed, minted once
  team_allocation_pct: 0
  emission_model: fixed_supply_distributed   # earned via Farmer sales, deed rewards, Windfalls, classified
  buy_tax_pct: null         # redacted; hard-coded caps
  sell_tax_pct: null        # redacted; rises during heavy net selling, eases back
  launch_buy_tax: true      # high at open, decays to normal; goes to team-set wallet, 100% back into game
  tax_split: [farmers_coop, root_cellars, small_team_cut]
  dex: uniswap_v4_single_official_pool_URC5
  lp_control: team_managed  # "can add, remove or rebalance"
  no_lp_fee: true
  team_leaning_launch_mcap_usd: 250000   # mirror: "team has said it is leaning towards"; May change
  team_leaning_launch_tax: {start_pct: 90, decay_hours: 24}
  taxes_live_in_pool_not_token: true     # token is a plain ERC-20 (abi_5); pool contract (abi_3) holds buy/sell fee bps

deed:                       # /docs/deed-gameplay/founding-deeds
  contract: "0x231142E88f523B0a4F46D2D79FAAB2cE1828E43a"   # docs + OpenSea API agree
  standard: ERC-721C
  royalty_pct: 5            # to project treasury
  opensea_fee_pct: 1        # from OpenSea API fees[]; total round-trip exit fee 6%
  tiers:                    # Fertility = the multiplier. "Every deed of the same rarity has the same Fertility"
    Mythic:    {count: 111,  fertility: 9, multiplier: 1.8, biome: Astral,  floor_eth: 2.66,  band: [2.10, 3.40]}
    Legendary: {count: 222,  fertility: 8, multiplier: 1.6, biome: Radiant, floor_eth: 1.60,  band: [1.42, 1.77]}
    Epic:      {count: 555,  fertility: 7, multiplier: 1.4, biome: Blight,  floor_eth: 1.18,  band: [1.03, 1.17]}
    Rare:      {count: 888,  fertility: 6, multiplier: 1.2, biome: Frost,   floor_eth: 0.96,  band: [0.88, 0.99]}
    Common:    {count: 1557, fertility: 5, multiplier: 1.0, biome: Meadow,  floor_eth: 0.875, band: [0.786, 0.90]}
  total_fertility: 19773    # Σ count × fertility
  owner_tier: Rare
  owner_count: 3
  fertility_uses: [fert_deck_output, root_cellar_share, claim_fee_rebate_share, windfall_share, classified]
  output_resource: Fertilizer
  output_per_fertility_per_day: 0.5   # docs 3 Nov: Common 2.5, Rare 3, Epic 3.5, Legendary 4, Mythic 4.5 per day
  output_per_cycle: 3.0     # Rare, per day (owner tier)
  cycle_hours: 24
  storage_cap_units: {Common: 7.5, Rare: 9, Epic: 10.5, Legendary: 12, Mythic: 13.5}
  storage_cap_days: 3       # deck stops when full; partial progress carries over
  action_required: true     # claim tx moves Fert to Bag
  stake_cost_eth: 0         # gas only; multiple deeds per tx
  build_cost_eth: 0.01      # Fert Deck, "at launch", may change; goes to staking contract (Root Cellars)
  unstake_destroys_structure: true
  unstake_while_paused: true   # changed 3 Nov (was blocked)
  staking_contract: "0x0AcFcD1483686fcd94DABeA03714321d0E05fc8D"   # 119-byte proxy; paused()=false; owner 0x93f0494af1d071d85b31ee41f6eba51a2c52dbae
  staked_deed_sellable: false
  upkeep_per_cycle: 0
  pays_yield_directly: false   # Stage One: Fertilizer only. Deed rewards in $YIELD later, split by Fertility, with a ███% claim fee
  claim_fee_pct: 10         # on-chain CLAIM_FEE_BPS=1000; split 50/50 (claimFeeSplit) staked-deeds / Silo
  claim_fee_split: [0.5, 0.5]
  no_back_pay: true         # in-app: rewards start when $YIELD launches; nothing accrues before

fert:                       # /docs/deed-gameplay/fertilizer
  effect: time_reduction
  magnitude_per_unit: 0.25  # cuts 25% of total grow time; max 2 per crop (50%)
  max_per_crop: 2
  instant_ripen_if_under: 0.25   # one unit with <25% time left ripens at once
  consumed_on_use: true
  expires: false
  sellable: true
  market_type: opensea_erc1155c
  royalty_pct: 5
  contract: "0xd9d6d0557F3479e801a967eb693ebE1ADA6E5317"   # ERC-1155C proxy
  price_usdg_2026_11_04: {floor: 4.80, top_offer: 3.51, cluster: 4.22}
  price_eth: 0.0019         # ≈4.25 USDG at ~$2,223/ETH; falling
  opensea_slug: yield-fields-items
  # ---- export rules (docs 3 Nov, "launch settings and may change")
  export_cap_per_day_frac: 0.5        # per wallet: half of decks' daily nominal output, decks counted over last 7 days; imports in last 24 h add to cap
  export_cap_per_day_owner: 4.5       # 3 Rares × 1.5
  exporter_slowdown:                  # starts 24 h after staking opened; based on exports in trailing 24 h as % of decks' daily output
    free_threshold_frac: 0.25         # ≤25%: full speed; FREE UNITS = ceil(F_total/8) per rolling 24 h (owner F=18 → 3/day); hard limit floor(F/4)=4/day
    rate_formula: "100% - 2 × (share - 25%)"   # linear, floor 50%
    rolling_24h: true                 # no 00:00 reset; recovery ~25 h after last export
    steps: {0.30: 0.9, 0.40: 0.7, 0.50: 0.5}   # export fraction → deck speed; "50% or more" → 0.5 floor
    bag_and_imports_exempt: true
  network_slowdown:                   # hourly; circulation = claimedTotal - usedTotal (BAG COUNTS); /api/fert-rate
    rate_formula: "min(1, target/supply), floor 0.5"   # mirror inference; matches 70%@10d, 50%@14d
    network_daily_export_cap: 60000
    api: https://yieldfields.fun/api/fert-rate
    snapshot_2026_11_04: {supply: 3848, target: 58614.5, output_per_day: 8373.5, staked_fertility: 16747, rate: 1.0}
    projected_floor_date: ~2026-11-21   # 50% speed if nothing consumes Fert
    free_days: 7                      # ≤7 days of output in circulation: full speed
    steps: {10: 0.7, 14: 0.5}         # days-of-output in circulation → speed; 14+ → 0.5 floor
    public_metrics: [circulation, target, current_rate]
  deck_speed: min(exporter_rate, network_rate), floor 0.5
  held_fert_never_confiscated: true

root_cellar:                # /docs/deed-gameplay/the-root-cellar + on-chain
  backing_eth_2026_11_04: 28.28
  per_deed_eth_2026_11_04: {Common: 0.00715, Rare: 0.00858, Epic: 0.01001, Legendary: 0.01144, Mythic: 0.01287}
  share_formula: backing * fertility / 19773
  funded_by: [fert_deck_build_fees, yield_tax_share_later]
  share_by: fertility       # every deed (staked or not) has one; only a STAKED deed can be burned to collect
  collect_by: burn_only
  payout_asset: ETH

silo:                       # /docs/deed-gameplay/the-silo-and-the-windfall
  funded_by: part_of_deed_reward_claim_fees
  payout_asset: YIELD
  windfall_pct_by_tier: {Common: 50, Rare: 60, Epic: 70, Legendary: 80, Mythic: 90}   # = min(F×10%,100%); jackpotCurve=(0,1000) confirms 10%/point from base 0
  sequential_race: true     # each burn takes its share of what the previous burn left; first burn on a fat Silo wins
  never_empties: true
  batch_burns_sequential: true   # each burn takes its share of what the previous left
  burn_min_payout_guard: true

seeds:                      # TESTNET DEFAULTS via mirror (grade B, "May change"); mainnet values come from the Cornhub contract (packPrices / vegetablePrices) at launch
  packs: {Diamond: 0.25, Platinum: 0.1, Gold: 0.05, Silver: 0.01, Bronze: 0.005}   # ETH
  same_odds_all_packs: true
  rarities: {Common: {p: 0.45, worth_x: 0.5}, Uncommon: {p: 0.31, worth_x: 1.0}, Rare: {p: 0.15, worth_x: 1.6},
             Epic: {p: 0.06, worth_x: 2.0}, Legendary: {p: 0.025, worth_x: 3.0}, Mythic: {p: 0.005, worth_x: 5.0}}
  ev_worth_x: 0.995         # Σ p × worth = 0.995 → crop value ≈ pack price before fees
  grow_hours_formula: "worth_x10 × tier_factor / 500"   # bundle-confirmed factors
  tier_factor: {Bronze: 120, Silver: 116, Gold: 108, Platinum: 104, Diamond: 100}
  grow_hours_diamond: {Common: 1, Uncommon: 2, Rare: 3.2, Epic: 4, Legendary: 6, Mythic: 10}
  avg_grow_hours: {Bronze: 2.38, Silver: 2.3, Gold: 2.15, Platinum: 2.07, Diamond: 1.98}
  rip_batch_max: 1000
  seeds_crops_packs_exportable: false   # only Fertilizer is on-chain in this build
  common_worth_below_pack: true
  bigger_pack_grows_faster_per_eth: true   # "splitting ETH across lots of small packs never beats 1 bigger pack"
  randomness: drand
  seeds_tradeable: true

farm:                       # /docs/farming-and-yield/growing-and-selling
  plot: free_fixed_grid     # 1 crop per slot, no expansions, no deed needed
  slots_per_wallet: 25      # confirmed by mirror glossary: free plot per WALLET, 25 slots, no deed needed
  grow_hours: [1, 12]       # Diamond Common 1 h … Bronze Mythic 12 h
  ripe_crops_wilt: false    # for selling; for TRUFFLES: 'Spoiling' at 24 h ripe, 'Spoiled' (no truffle) at 48 h
  farmer_pays_pct_in_yield: 90      # testnet default: crop value − 10% fee, swapped on the pool tax-free (docs say Farmer dues will be LOWER on mainnet)
  broker_pays_pct_in_eth: 90        # testnet default: 10% fee; paid from Cornhub float (pack ETH)
  coop_dues_farmer_pct: 10
  coop_dues_broker_pct: 10
  fees_go_to: buyback_vault         # buys $YIELD on the pool, all of it to the Truffle Pool
  farmer_opens_on_own_switch: true  # not tied to launch tax; date unknown
  market_float_risk: true           # 'The Market is short on ETH' stops sales when pack float is low

truffles:                   # mirror + bundle strings (Truffle Pig, 1 in 20, Motherlode, Spoiling all confirmed in bundle)
  pig_required: true        # one per wallet, bought at Cornhub in ETH; price REDACTED; only crops planted AFTER purchase roll
  chance_per_harvest: 0.05
  harvest_within_hours_of_ripe: 48
  weight: crop_eth_value    # inferred; ranked like the crop
  settlement_utc: "00:00"
  payout_formula: "seed_release_today + 5% × max(0, refill_balance − seed_release_today), capped by claim limit; 5% to Motherlode; rest split by weight; ≤5% of pool per truffle"
  launch_seed_days: 30      # after day 30 only refills (buybacks from fees) pay
  seed_size: null           # not public
  claim: signed voucher → Truffle Pool contract, one tx for all settled payouts
weather: {}                 # not in docs (the "dynamic weather" claim came from a lookalike site)
leaderboard: {placeholder: true, boards: [harvest_value, truffle_payouts, burn_value_held]}
classified: [truffles, volume_incentive_mechanism, extra_deed_reward_stream, fert_deck_boosts, new_structures]

governance:                 # /docs/reference/fees-and-risks
  owner: team_multisig
  timelock: false
  contracts_upgradeable: true     # including deed staking; "updates apply to staked deeds too"
  audit: planned_not_done
  team_can_move_staked_deed: false

mint:                       # on-chain deed contract + /api/mint/state
  gtd_price_eth: 0.1
  gtd_minted: 2338          # 3333 - 975 public - 20 team
  public_minted: 975
  public_final_eth: 0.999687511574074075
  team_reserve: 20
  proceeds_eth: 1208.5      # 'withdrawn'
  basis_distribution: {0.1: 0.701, 0.9997: 0.293, 0: 0.006}

unreleased_abis:            # shipped in the frontend bundle; values unknown until deployed
  cornhub: abi/abi_2.json
  yield_pool: abi/abi_3.json       # in-house AMM with virtualEthReserve, buy/sell fee bps, maxSellFeeBps
  truffle_vester: abi/abi_4.json
  buyback: abi/abi_6.json          # DAILY_RATE_BPS of Co-op pool → buys $YIELD → trufflePool
  yield_token: abi/abi_5.json

owner:
  wallet: "0x139e79b0d01148712528d56625a2a59f676e3952"   # read-only
  deeds: [537, 660, 661]
