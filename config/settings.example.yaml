# Copy to config/settings.yaml (gitignored). Read-only tooling; NO private keys here.
chain:
  name: robinhood-mainnet
  chain_id: 4663                       # verified (A)
  rpc_url: https://rpc.mainnet.chain.robinhood.com   # B — verify against docs.robinhood.com/chain
  explorer_api: https://robinhoodchain.blockscout.com/api   # behind Cloudflare challenge from scripts (2026-10-30); use RPC instead
  explorer_url: https://robinhoodchain.blockscout.com

contracts:
  deed_nft: "0x231142E88f523B0a4F46D2D79FAAB2cE1828E43a"   # docs Official-links page == OpenSea API (verified 2026-10-30)
  yield_token: null       # ERC-20 — same rule; token not confirmed live as of 2026-10-30
  deed_staking: "0x0AcFcD1483686fcd94DABeA03714321d0E05fc8D"   # EIP-1967 proxy, impl 0xaa4478ef0c7bc33dae45fa5ff870877325c34308
  items: "0xd9d6d0557F3479e801a967eb693ebE1ADA6E5317"          # Fertilizer ERC-1155C proxy, impl 0xe0b488f1fd4dab9c8566fedd883d4229a31c4aa9

opensea:
  api_key: ""             # /collections/{slug} and /stats work WITHOUT a key (verified); listings/offers/events need one
  collection_slug: yield-field-deeds
  items_slug: yield-fields-items   # Fertilizer (and future items) — stats endpoint works without a key
  chain_slug: robinhood   # verified from GET /api/v2/collections/yield-field-deeds contracts[].chain

wallets:                  # addresses you OWN, read-only monitoring
  - null

alerts:
  floor_below_eth: 0.70
  floor_above_eth: 1.50
  best_offer_above_eth: 1.20
  volume_24h_below_usd: 10000
  poll_seconds: 900
  fert_claim_every_hours: 60   # storage caps at 72 h of production; deck stops when full

pricing:
  eth_usd_source: coingecko   # used only for USD marks; replace if blocked
