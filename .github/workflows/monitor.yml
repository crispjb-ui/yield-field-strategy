name: monitor
on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 h UTC
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: monitor
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Build STATUS.md and snapshots
        run: python -m yf.status
      - name: Commit data
        run: |
          git config user.name "yf-monitor"
          git config user.email "yf-monitor@users.noreply.github.com"
          git add STATUS.md data/snapshots data/docs_state.json data/alerts.json
          git diff --cached --quiet || git commit -m "monitor: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push
      - name: Open alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(python -c "import json;print(len(json.load(open('data/alerts.json'))['alerts']))")
          if [ "$n" != "0" ]; then
            body=$(python -c "import json;print('\n'.join('- '+a for a in json.load(open('data/alerts.json'))['alerts']))")
            title="ALERT: Yield Fields monitor $(date -u +%Y-%m-%d)"
            existing=$(gh issue list --label alert --state open --search "$title" --json number --jq '.[0].number')
            if [ -z "$existing" ]; then
              gh label create alert --color B60205 --force >/dev/null 2>&1 || true
              gh issue create --title "$title" --label alert --body "$body"$'\n\nSee STATUS.md.'
            else
              gh issue comment "$existing" --body "$body"
            fi
          fi
