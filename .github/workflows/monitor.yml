name: monitor
on:
  schedule:
    - cron: "17 * * * *"        # hourly through launch week (was every 6 h; revert after 2026-12-05)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: monitor
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Build STATUS.md and snapshots
        run: python -m yf.status
      - name: Commit data
        run: |
          git config user.name "yf-monitor"
          git config user.email "yf-monitor@users.noreply.github.com"
          git add STATUS.md data/snapshots data/docs_state.json data/alerts.json data/cornhub_state.json
          git diff --cached --quiet || git commit -m "monitor: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push
      - name: Open alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(python -c "import json;print(len(json.load(open('data/alerts.json'))['new_alerts']))")
          c=$(python -c "import json;print(len(json.load(open('data/alerts.json'))['cleared']))")
          if [ "$n" != "0" ]; then
            body=$(python -c "import json;d=json.load(open('data/alerts.json'));print('New:\n'+'\n'.join('- '+a for a in d['new_alerts'])+'\n\nStill active:\n'+'\n'.join('- '+a for a in d['alerts']))")
            title="ALERT: $(python -c "import json;print(json.load(open('data/alerts.json'))['new_alerts'][0][:70])")"
            gh label create alert --color B60205 --force >/dev/null 2>&1 || true
            gh issue create --title "$title" --label alert --body "$body"$'\n\nSee STATUS.md.'
          fi
          if [ "$c" != "0" ]; then
            body=$(python -c "import json;print('Cleared:\n'+'\n'.join('- '+a for a in json.load(open('data/alerts.json'))['cleared']))")
            for i in $(gh issue list --label alert --state open --json number --jq '.[].number'); do gh issue close "$i" --comment "$body" >/dev/null; done
          fi
